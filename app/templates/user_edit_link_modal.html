<!-- User Edit Link Modal -->
<div id="userEditLinkModal" class="modal-overlay" style="display: none; z-index: 10000;">
    <div class="modal-content" style="max-width: 800px; width: 90%; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="font-size: 1.25rem;">Edit Link</h2>
            <button class="close-modal" onclick="document.getElementById('userEditLinkModal').style.display='none'"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <form id="userEditLinkForm" method="POST" class="standard-form">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="user_edit_url" style="font-weight: 500;">URL <span class="required">*</span></label>
                    <input type="url" id="user_edit_url" name="url" required class="form-control" style="width: 100%;">
                </div>
                
                <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group half-width" style="flex: 1;">
                        <label for="user_edit_title" style="font-weight: 500;">Title</label>
                        <input type="text" id="user_edit_title" name="title" class="form-control" style="width: 100%;">
                    </div>
                    
                    <div class="form-group half-width custom-select-wrapper" style="flex: 1;">
                        <label for="user_edit_link_type" style="font-weight: 500;">Link Type</label>
                        <select id="user_edit_link_type" name="link_type">
                            <option value="Website">Website</option>
                            <option value="GitHub">GitHub</option>
                            <option value="Documentation">Documentation</option>
                            <option value="YouTube">YouTube</option>
                            <option value="Article">Article</option>
                            <option value="Research Paper">Research Paper</option>
                            <option value="AI Tool">AI Tool</option>
                            <option value="Development Tool">Development Tool</option>
                            <option value="Repository">Repository</option>
                            <option value="Course">Course</option>
                            <option value="Reference">Reference</option>
                            <option value="Portfolio">Portfolio</option>
                            <option value="Design">Design</option>
                            <option value="Social Media">Social Media</option>
                            <option value="Podcast">Podcast</option>
                            <option value="Video">Video</option>
                            <option value="E-commerce">E-commerce</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="user_edit_desc" style="font-weight: 500;">Description</label>
                    <textarea id="user_edit_desc" name="description" rows="3" class="form-control" style="width: 100%;"></textarea>
                </div>
                
                <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group half-width" style="flex: 1;">
                        <label for="user_edit_collection" style="font-weight: 500;">Collection</label>
                        <select id="user_edit_collection" name="collection_id" class="form-control" style="width: 100%;">
                            <option value="">None (Unorganized)</option>
                            {% for collection in collections %}
                                <option value="{{ collection.id }}">{{ collection.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group half-width" style="flex: 1;">
                        <label for="user_edit_tags" style="font-weight: 500;">Tags</label>
                        <input type="text" id="user_edit_tags" name="tags" placeholder="e.g. python, tutorial, web" class="form-control" style="width: 100%;">
                    </div>
                </div>
                
                <div class="form-group checkbox-group mt-3" style="margin-bottom: 25px;">
                    <label class="checkbox-container">
                        <input type="checkbox" name="is_favorite" id="user_edit_favorite">
                        <span class="checkmark"></span>
                        Mark as Favorite
                    </label>
                </div>
                
                <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('userEditLinkModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Link</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let userEditMDE = null;

    function openUserEditModal(linkId) {
        // Show loading indicator or directly fetch
        fetch(`/api/links/${linkId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('user_edit_title').value = data.title;
                document.getElementById('user_edit_url').value = data.url;
                document.getElementById('user_edit_desc').value = data.description;
                document.getElementById('user_edit_tags').value = data.tags;
                document.getElementById('user_edit_favorite').checked = data.is_favorite;
                
                // Select type
                const typeSelect = document.getElementById('user_edit_link_type');
                for (let i = 0; i < typeSelect.options.length; i++) {
                    if (typeSelect.options[i].value === data.link_type) {
                        typeSelect.selectedIndex = i;
                        typeSelect.dispatchEvent(new Event('change'));
                        break;
                    }
                }
                
                // Select collection
                const colSelect = document.getElementById('user_edit_collection');
                if (data.collection_id) {
                    for (let i = 0; i < colSelect.options.length; i++) {
                        if (colSelect.options[i].value == data.collection_id) {
                            colSelect.selectedIndex = i;
                            break;
                        }
                    }
                } else {
                    colSelect.selectedIndex = 0;
                }
                
                // Update form action
                const form = document.getElementById('userEditLinkForm');
                form.action = "{{ url_for('links.edit_link', link_id=0) }}".replace('0', linkId);
                
                document.getElementById('userEditLinkModal').style.display = 'flex';
            })
            .catch(error => {
                console.error("Error fetching link details:", error);
                alert("Failed to load link details for editing.");
            });
    }
</script>
