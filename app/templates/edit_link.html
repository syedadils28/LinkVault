{% extends "base.html" %}

{% block title %}Edit Link - LinkVault{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-content">
        <h1>Edit Link</h1>
        <p>Update information for this resource.</p>
    </div>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('links.edit_link', link_id=link.id) }}" class="standard-form">
        <div class="form-group">
            <label for="url">URL <span class="required">*</span></label>
            <input type="url" id="url" name="url" class="form-control" required value="{{ link.url }}">
        </div>
        
        <div class="form-row">
            <div class="form-group half-width">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ link.title or '' }}">
            </div>
            
            <div class="form-group half-width custom-select-wrapper">
                <label for="link_type">Link Type</label>
                <select id="link_type" name="link_type">
                    {% set types = ['Website', 'GitHub', 'Documentation', 'YouTube', 'Article', 'Research Paper', 'AI Tool', 'Development Tool', 'Repository', 'Course', 'Reference', 'Portfolio', 'Design', 'Social Media', 'Podcast', 'Video', 'E-commerce', 'Other'] %}
                    {% for t in types %}
                        <option value="{{ t }}" {% if link.link_type == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ link.description or '' }}</textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group half-width">
                <label for="collection_id">Collection</label>
                <select id="collection_id" name="collection_id" class="form-control">
                    <option value="">None (Unorganized)</option>
                    {% for collection in collections %}
                        <option value="{{ collection.id }}" {% if link.collection_id == collection.id %}selected{% endif %}>{{ collection.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group half-width">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" class="form-control" value="{{ tags_str }}">
            </div>
        </div>
        
        <div class="form-group checkbox-group mt-3">
            <label class="checkbox-container">
                <input type="checkbox" name="is_favorite" id="is_favorite" {% if link.is_favorite %}checked{% endif %}>
                <span class="checkmark"></span>
                Mark as Favorite
            </label>
        </div>
        
        <div class="form-actions mt-4">
            <a href="{{ url_for('links.view_links') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Link</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
