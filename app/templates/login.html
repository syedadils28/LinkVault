{% extends "base.html" %}

{% block title %}Login - LinkVault{% endblock %}

{% block content %}
<div class="auth-container">
    <a href="{{ url_for('dashboard.index') }}" class="back-to-home">
        <i data-lucide="arrow-left"></i> Back to Home
    </a>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i data-lucide="link-2"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Log in to your LinkVault account</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember_me" id="remember_me">
                    <span class="checkmark"></span>
                    Remember me
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
