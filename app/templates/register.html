{% extends "base.html" %}

{% block title %}Register - LinkVault{% endblock %}

{% block content %}
<div class="auth-container">
    <a href="{{ url_for('dashboard.index') }}" class="back-to-home">
        <i data-lucide="arrow-left"></i> Back to Home
    </a>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i data-lucide="user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join LinkVault to organize your web</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" name="username" required autofocus placeholder="Choose a username">
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-with-icon">
                    <i data-lucide="mail"></i>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Choose a secure password">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
